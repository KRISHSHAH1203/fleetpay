services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fleetpay
      MYSQL_USER: fleetpay
      MYSQL_PASSWORD: fleetpay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fleetpay
      DB_USER: fleetpay
      DB_PASSWORD: fleetpay
    ports:
      - "8080:8080"
